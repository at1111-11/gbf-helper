<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>그랑블루 도우미</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <nav class="tabs" role="tablist" aria-label="기능">
      <button type="button" class="tile tile-monthly" role="tab" data-tab="monthly" aria-selected="true">
        <span class="tile-icons" aria-hidden="true"><img src="img/item-gold.webp" alt=""><img src="img/item-half.webp" alt=""><img src="img/item-seed.webp" alt=""></span>
        <span class="tile-text">월간교환</span>
      </button>
      <button type="button" class="tile tile-search" role="tab" data-tab="search" aria-selected="false">
        <span class="tile-icons yt" aria-hidden="true"></span>
        <span class="tile-text">레이드 탐색기</span>
      </button>
      <button type="button" class="tile tile-gw" role="tab" data-tab="gw" aria-selected="false">
        <span class="tile-icons" aria-hidden="true"><img src="img/gw/g-meat.webp" alt=""></span>
        <span class="tile-text">고전장</span>
      </button>
      <button type="button" class="tile tile-trehun" role="tab" data-tab="trehun" aria-selected="false">
        <span class="tile-icons" aria-hidden="true"><img src="img/item-stellar.jpg" alt=""></span>
        <span class="tile-text">극성기 계산기</span>
      </button>
      <button type="button" class="tile tile-pattern" role="tab" data-tab="pattern" aria-selected="false">
        <span class="tile-icons" aria-hidden="true"><img src="img/raids/versusia.webp" alt=""></span>
        <span class="tile-text">패턴표</span>
      </button>
      <button type="button" class="tile tile-recommend" role="tab" data-tab="recommend" aria-selected="false">
        <span class="tile-icons" aria-hidden="true"><img src="img/vane.webp" alt=""></span>
        <span class="tile-text">베인 노트</span>
      </button>
    </nav>
  </header>
  <main>
    <div id="tab-monthly" class="tab" role="tabpanel"></div>
    <div id="tab-trehun" class="tab" role="tabpanel" hidden></div>
    <div id="tab-gw" class="tab" role="tabpanel" hidden></div>
    <div id="tab-search" class="tab" role="tabpanel" hidden></div>
    <div id="tab-pattern" class="tab" role="tabpanel" hidden></div>
    <div id="tab-recommend" class="tab" role="tabpanel" hidden></div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/monthly.js"></script>
  <script src="js/trehun-ui.js"></script>
  <script src="js/gw.js"></script>
  <script src="js/search-data.js"></script>
  <script src="js/search-core.js"></script>
  <script src="js/search.js"></script>
  <script src="js/pattern-data.js"></script>
  <script src="js/pattern.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
